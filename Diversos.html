    <!-- CORREÇÃO JAVASCRIPT: Força o vídeo a pausar quando o pop-up fechar -->
    <script>
      const popup = document.querySelector(".popup-video");
      const popupVid = document.querySelector(".popup-video video");

      document.querySelectorAll(".video-container video").forEach((vid) => {
        vid.onclick = (e) => {
          e.preventDefault(); // Impede o play direto na grade se clicado na borda
          popup.style.display = "block";
          popupVid.src = vid.getAttribute("src");
          popupVid.play();
        };
      });

      document.querySelector(".popup-video span").onclick = () => {
        popup.style.display = "none";
        popupVid.pause(); // CORREÇÃO: Pausa o vídeo para não continuar tocando escondido
        popupVid.src = ""; // Reseta a origem
      };
    </script>
